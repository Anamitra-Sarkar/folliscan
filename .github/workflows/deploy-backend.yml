name: Deploy Backend to HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Space tree (backend + shared ml package)
        run: |
          mkdir -p space_deploy
          cp -r backend/* space_deploy/
          cp -r ml space_deploy/ml
          rm -rf space_deploy/ml/__pycache__ space_deploy/ml/*/__pycache__
      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@folliscan.dev"
          git config --global user.name "folliscan-ci"
          cd space_deploy
          git init -b main
          git add -A
          git -c user.name="ci" -c user.email="ci@folliscan.dev" commit -m "sync from GitHub ${GITHUB_SHA::7}"
          git remote add space "https://api:$HF_TOKEN@huggingface.co/spaces/${{ vars.HF_SPACE_ID }}" 2>/dev/null || true
          git push --force space main
