name: Deploy User API to Render

on:
  push:
    branches: [main]
    paths:
      - "services/user-api/**"
      - ".github/workflows/deploy-userapi.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/folliscan-user-api

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/user-api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trigger Render deploy
        run: |
          code=$(curl -s -o /tmp/render_resp.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK" -d '{}')
          echo "render hook status: $code"; cat /tmp/render_resp.txt
          test "$code" = "200" || test "$code" = "201"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
